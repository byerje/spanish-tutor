name: Publish to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'lessons/**'
      - 'assets/**'
      - 'reference/**'
      - 'index.html'
      - '.github/workflows/publish-to-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    name: Build and Deploy to GitHub Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build site
        run: |
          echo "Preparing files for GitHub Pages deployment..."
          # Create public directory structure
          mkdir -p public
          cp -r lessons public/
          cp -r assets public/
          cp -r reference public/
          cp index.html public/
          echo "✓ All files copied to public directory"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
